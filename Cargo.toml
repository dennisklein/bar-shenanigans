[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "GPL-2.0-or-later"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
mlua = { version = "0.10", features = ["lua51", "vendored", "error-send", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
